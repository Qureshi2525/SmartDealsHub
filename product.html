<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | SmartDealsHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="index.html">
SmartDealsHub
</a>

</div>
</nav>

<div class="container py-5">

<div class="row">
    <div class="col-md-6">
    <img id="productImage" class="img-fluid rounded shadow" alt="Product Image">
</div>

<div class="col-md-6">

    <span id="productBadge" class="badge bg-danger mb-2"></span>

    <h2 id="productTitle"></h2>

    <p class="text-muted">
        Brand:
        <span id="productBrand"></span>
    </p>

    <h3 class="text-primary" id="productPrice"></h3>

    <p id="productDescription"></p>

    <div class="mb-3">
        ⭐⭐⭐⭐⭐
        <span id="productRating"></span>
    </div>

    <a id="buyButton"
       target="_blank"
       class="btn btn-warning btn-lg">
       <i class="fa-brands fa-amazon"></i>
       Buy on Amazon
    </a>
    <div class="mt-3">

<h5>Share this Product</h5>

<div class="mt-3">
    <button class="btn btn-success me-2"
            onclick="shareWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i>
        WhatsApp
    </button>

    <button class="btn btn-primary me-2"
            onclick="shareFacebook()">
        <i class="fa-brands fa-facebook"></i>
        Facebook
    </button>

    <button class="btn btn-dark me-2"
            onclick="shareX()">
        <i class="fa-brands fa-x-twitter"></i>
        X
    </button>

    <button class="btn btn-secondary"
            onclick="copyProductLink()">
        <i class="fa-solid fa-link"></i>
        Copy Link
    </button>
</div>
<a id="pinterestBtn"
   target="_blank"
   class="btn btn-danger btn-lg mt-2">
   <i class="fa-brands fa-pinterest"></i>
   Save to Pinterest
</a>
    <a href="index.html" class="btn btn-outline-secondary btn-lg ms-2">
        Back
    </a>

</div>

</div>

</div>

<script src="js/product.js"></script>
<script>
function getShareUrl() {
    return window.location.href;
}

function shareWhatsApp() {
    const url = encodeURIComponent(getShareUrl());
    const text = encodeURIComponent("Check out this amazing deal on SmartDealsHub!");
    window.open(
        "https://wa.me/?text=" + text + "%20" + url,
        "_blank"
    );
}

function shareFacebook() {
    const url = encodeURIComponent(getShareUrl());
    window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" + url,
        "_blank",
        "width=600,height=500"
    );
}

function shareX() {
    const url = encodeURIComponent(getShareUrl());
    const text = encodeURIComponent("Check out this amazing deal on SmartDealsHub!");
    window.open(
        "https://twitter.com/intent/tweet?text=" + text + "&url=" + url,
        "_blank",
        "width=600,height=500"
    );
}

function copyProductLink() {
    navigator.clipboard.writeText(getShareUrl())
        .then(() => {
            alert("Product link copied successfully!");
        })
        .catch(() => {
            alert("Unable to copy link.");
        });
}
</script>
</body>
</html>
